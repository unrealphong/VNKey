[package]
name = "vnkey"
description = "VNKey Vietnamese input daemon for macOS and Linux"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
enigo = "0.6.1"
inputs = "0.1.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
vnkey-engine = { path = "../vnkey-engine", features = ["serde"] }

[lints]
workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
dispatch2 = "0.3"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSRunningApplication", "NSWorkspace"] }
tray-icon = "0.26"
